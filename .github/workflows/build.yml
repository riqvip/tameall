name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run build
        run: ./gradlew build --no-daemon

      - name: Run server GameTests
        run: ./gradlew runGameTestServer --no-daemon

  client_game_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run client GameTests
        env:
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a ./gradlew runClientGameTest --no-daemon

      - name: Upload client screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tameall-client-gametest-results
          path: |
            build/run/clientGameTest/screenshots
            build/run/clientGameTest/logs
